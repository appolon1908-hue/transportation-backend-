name: apply-runtime-hardening

on:
  push:
    branches:
      - "be/release-readiness-v6"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be/release-readiness-v6
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical runtime patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              value = target.read_text()
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              target.write_text(value.replace(old, new, 1))

          # Fix the new role migration's PostgreSQL UUID import.
          replace_once(
              "migrations/versions/0004_integration_rls_roles.py",
              "import sqlalchemy as sa\n",
              "import sqlalchemy as sa\nfrom sqlalchemy.dialects import postgresql\n",
          )
          roles = Path("migrations/versions/0004_integration_rls_roles.py")
          roles.write_text(
              roles.read_text().replace(
                  "sa.dialects.postgresql.UUID(as_uuid=True)",
                  "postgresql.UUID(as_uuid=True)",
              )
          )

          # Ensure all canonical ORM metadata is loaded by Alembic.
          replace_once(
              "migrations/env.py",
              "import app.models  # noqa: F401\n",
              "import app.models  # noqa: F401\n"
              "import app.integrations.models  # noqa: F401\n"
              "import app.portals.models  # noqa: F401\n"
              "import app.portals.submission_models  # noqa: F401\n",
          )

          # Compliance now depends on the one canonical core migration chain.
          compliance_path = Path("compliance_migrations/versions/0001_carrier_readiness.py")
          compliance = compliance_path.read_text().replace(
              "Requires core 0002_identity_tenancy and integrations 0001_integrations_durability.",
              "Requires canonical core 0005_portal_workflows.",
          ).replace("0002_identity_tenancy", "0005_portal_workflows")
          start = compliance.index("    integration_table = bind.execute(")
          end_marker = '    op.execute(sa.text("CREATE EXTENSION IF NOT EXISTS pgcrypto"))'
          end = compliance.index(end_marker)
          canonical_check = '''    integration_table = bind.execute(
              sa.text("SELECT to_regclass('public.integration_connections')")
          ).scalar_one_or_none()
          if integration_table is None:
              raise RuntimeError(
                  "Compliance migration requires canonical core integration tables."
              )

          '''
          compliance = compliance[:start] + canonical_check + compliance[end:]
          policy_marker = "    for table_name in TENANT_TABLES:\n        _tenant_policy(table_name)\n"
          if compliance.count(policy_marker) != 1:
              raise SystemExit("compliance policy marker not found exactly once")
          compliance = compliance.replace(
              policy_marker,
              policy_marker
              + "\n    op.execute(\n"
              + "        sa.text(\n"
              + "            \"GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE \"\n"
              + "            + \", \".join(f'\\\"{name}\\\"' for name in TENANT_TABLES)\n"
              + "            + \" TO freight_api\"\n"
              + "        )\n"
              + "    )\n",
              1,
          )
          compliance_path.write_text(compliance)

          # Public webhook ingress uses its dedicated database credential and a
          # non-enumerable route resolver before setting tenant context.
          api_path = Path("app/integrations/api.py")
          api = api_path.read_text()
          api = api.replace("from sqlalchemy import select\n", "from sqlalchemy import select, text\n", 1)
          api = api.replace("from app.db import get_db\n", "from app.db import get_db, get_ingress_db\n", 1)
          lookup_start = api.index("async def _lookup_public_connection(")
          lookup_end = api.index("\n\nasync def _receive_webhook(", lookup_start)
          lookup = '''async def _lookup_public_connection(
              db: AsyncSession, webhook_slug: str
          ) -> IntegrationConnection:
              resolved = (
                  await db.execute(
                      text(
                          "SELECT connection_id, tenant_id "
                          "FROM public.freight_resolve_webhook_connection(:webhook_slug)"
                      ),
                      {"webhook_slug": webhook_slug},
                  )
              ).one_or_none()
              if resolved is None:
                  raise HTTPException(
                      status_code=404,
                      detail={
                          "code": "WEBHOOK_NOT_FOUND",
                          "message": "Webhook endpoint not found.",
                      },
                  )
              connection_id, tenant_id = resolved
              await set_tenant_context(db, tenant_id, "webhook-ingress")
              item = await db.scalar(
                  select(IntegrationConnection).where(
                      IntegrationConnection.id == connection_id,
                      IntegrationConnection.tenant_id == tenant_id,
                      IntegrationConnection.enabled.is_(True),
                  )
              )
              if item is None:
                  raise HTTPException(
                      status_code=404,
                      detail={
                          "code": "WEBHOOK_NOT_FOUND",
                          "message": "Webhook endpoint not found.",
                      },
                  )
              return item
          '''
          api = api[:lookup_start] + lookup + api[lookup_end:]
          public_start = api.index('@router.post("/integrations/{webhook_slug}/webhooks/{provider}"')
          prefix, public = api[:public_start], api[public_start:]
          count = public.count("db: AsyncSession = Depends(get_db)")
          if count != 2:
              raise SystemExit(f"expected two public webhook DB dependencies, found {count}")
          public = public.replace(
              "db: AsyncSession = Depends(get_db)",
              "db: AsyncSession = Depends(get_ingress_db)",
          )
          api_path.write_text(prefix + public)

          # One migration chain and one worker implementation are authoritative.
          entrypoint = Path("deploy/backend/entrypoint-v4.sh")
          value = entrypoint.read_text()
          value = value.replace(
              "read_secret_into_env GATEWAY_SHARED_SECRET\n",
              "read_secret_into_env DATABASE_URL\n"
              "read_secret_into_env INGRESS_DATABASE_URL\n"
              "read_secret_into_env WORKER_DATABASE_URL\n"
              "read_secret_into_env GATEWAY_SHARED_SECRET\n",
              1,
          )
          value = value.replace("    alembic -c alembic-integrations.ini upgrade head\n", "", 1)
          value = value.replace(
              "exec python -m app.integrations.worker \"$@\"",
              "exec python -m workers.integration_worker \"$@\"",
              1,
          )
          entrypoint.write_text(value)

          compose = Path("deploy/docker-compose.integrations.yml")
          value = compose.read_text().replace(
              "MIGRATION_HEAD: 0003_integrations_durability",
              "MIGRATION_HEAD: 0005_portal_workflows",
          ).replace(
              "assert os.getenv('DATABASE_URL'); assert os.getenv('INTEGRATION_ALLOWED_HOSTS')",
              "assert os.getenv('WORKER_DATABASE_URL'); assert os.getenv('INTEGRATION_ALLOWED_HOSTS')",
          )
          compose.write_text(value)

          # Remove the incompatible duplicate integration Alembic track.
          Path("alembic-integrations.ini").unlink()
          shutil.rmtree("integration_migrations")

          # Remove this one-time workflow from the resulting commit.
          Path(".github/workflows/apply-runtime-hardening.yml").unlink()
          PY

      - name: Verify Python syntax
        run: python -m compileall -q app migrations compliance_migrations workers tests

      - name: Commit hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): canonicalize migrations and database trust boundaries"
          git push origin HEAD:be/release-readiness-v6
