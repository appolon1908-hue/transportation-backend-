name: fix-compliance-precondition

on:
  push:
    branches:
      - "be/release-readiness-v6"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be/release-readiness-v6
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair migration and verify syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("compliance_migrations/versions/0001_carrier_readiness.py")
          value = path.read_text()
          block = "\n".join(
              [
                  "    integration_table = bind.execute(",
                  "        sa.text(\"SELECT to_regclass('public.integration_connections')\")",
                  "    ).scalar_one_or_none()",
                  "    if integration_table is None:",
                  "        raise RuntimeError(",
                  "            \"Compliance migration requires canonical core integration tables.\"",
                  "        )",
                  "",
                  "",
              ]
          )
          start = value.index("    integration_table = bind.execute(")
          end = value.index(
              "    op.execute(sa.text(\"CREATE EXTENSION IF NOT EXISTS pgcrypto\"))",
              start,
          )
          path.write_text(value[:start] + block + value[end:])
          Path(".github/workflows/fix-compliance-precondition.yml").unlink()
          PY
          python -m compileall -q compliance_migrations
          python -m pip install -q ruff==0.12.12
          ruff check compliance_migrations/versions/0001_carrier_readiness.py

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(migrations): restore compliance precondition scope"
          git push origin HEAD:be/release-readiness-v6
