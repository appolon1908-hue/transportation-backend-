name: Audit every repository branch

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-branch-audit-${{ github.repository }}
  cancel-in-progress: false

env:
  REPOSITORY_CLASS: backend

jobs:
  audit:
    name: all-branches-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Audit every branch tip
        run: |
          set -Eeuo pipefail
          policy="$GITHUB_WORKSPACE/scripts/ci/validate_repository.py"
          evidence="$GITHUB_WORKSPACE/evidence/branches"
          mkdir -p "$evidence"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          failures=0
          total=0
          while IFS= read -r ref; do
            branch="${ref#origin/}"
            test "$branch" != "HEAD" || continue
            total=$((total + 1))
            key="$(printf '%s' "$branch" | sha256sum | cut -c1-16)"
            worktree="$RUNNER_TEMP/branch-$key"
            log="$evidence/$key.log"
            git worktree add --detach "$worktree" "$ref" >/dev/null
            {
              echo "BRANCH=$branch"
              echo "COMMIT=$(git -C "$worktree" rev-parse HEAD)"
              python "$policy" --root "$worktree" --mode audit --branch "$branch" --repository-class "$REPOSITORY_CLASS"
            } >"$log" 2>&1 || failures=$((failures + 1))
            git worktree remove --force "$worktree"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sort)
          python - "$evidence" "$total" "$failures" <<'PY'
          import json, os, sys
          from pathlib import Path
          (Path(sys.argv[1]).parent / 'summary.json').write_text(json.dumps({
              'schema_version': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'audited_branch_count': int(sys.argv[2]),
              'failed_branch_count': int(sys.argv[3]),
              'runtime_deployment_authorized': False,
              'external_effects_authorized': False,
          }, indent=2, sort_keys=True) + '\n')
          PY
          echo "AUDITED_BRANCHES=$total"
          echo "FAILED_BRANCHES=$failures"
          test "$failures" -eq 0
      - name: Upload branch-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-branch-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
