name: capture-runtime-audit

on:
  push:
    branches:
      - "be/release-readiness-v6"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be/release-readiness-v6
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build runtime requirements and capture audit
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install --upgrade pip pip-audit
          python - <<'PY'
          from pathlib import Path
          import tomllib

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          dependencies = metadata.get("project", {}).get("dependencies", [])
          Path("/tmp/runtime-requirements.txt").write_text(
              "\n".join(dependencies) + "\n",
              encoding="utf-8",
          )
          PY

          mkdir -p docs/ci
          set +e
          pip-audit --strict --desc -r /tmp/runtime-requirements.txt \
            --format json --output /tmp/runtime-audit.json \
            > /tmp/runtime-audit.stdout 2> /tmp/runtime-audit.stderr
          status=$?
          set -e

          python - "$status" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          report_path = Path("/tmp/runtime-audit.json")
          stdout = Path("/tmp/runtime-audit.stdout").read_text(encoding="utf-8", errors="replace")[-8000:]
          stderr = Path("/tmp/runtime-audit.stderr").read_text(encoding="utf-8", errors="replace")[-8000:]
          payload: dict[str, object] = {
              "exit_code": status,
              "requirements": Path("/tmp/runtime-requirements.txt").read_text(encoding="utf-8").splitlines(),
              "stdout_tail": stdout,
              "stderr_tail": stderr,
          }
          if report_path.exists():
              try:
                  raw = json.loads(report_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  payload["json_error"] = str(exc)
              else:
                  dependencies = raw.get("dependencies", []) if isinstance(raw, dict) else []
                  findings = []
                  for dependency in dependencies:
                      if not isinstance(dependency, dict):
                          continue
                      vulns = dependency.get("vulns") or []
                      if vulns:
                          findings.append(
                              {
                                  "name": dependency.get("name"),
                                  "version": dependency.get("version"),
                                  "vulnerabilities": [
                                      {
                                          "id": vuln.get("id"),
                                          "fix_versions": vuln.get("fix_versions", []),
                                          "description": str(vuln.get("description") or "")[:1000],
                                      }
                                      for vuln in vulns
                                      if isinstance(vuln, dict)
                                  ],
                              }
                          )
                  payload["findings"] = findings
                  payload["finding_count"] = len(findings)
          Path("docs/ci/runtime-audit-evidence.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm .github/workflows/capture-runtime-audit.yml

      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(security): record runtime dependency audit evidence"
          git push origin HEAD:be/release-readiness-v6
