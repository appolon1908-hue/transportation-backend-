name: capture-contract-failure

on:
  push:
    branches:
      - "be/release-readiness-v6"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
          POSTGRES_DB: freight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://freight:freight@127.0.0.1:5432/freight_test
      INGRESS_DATABASE_URL: postgresql+asyncpg://freight:freight@127.0.0.1:5432/freight_test
      WORKER_DATABASE_URL: postgresql+asyncpg://freight:freight@127.0.0.1:5432/freight_test
      ALLOW_DEVELOPMENT_IDENTITY_HEADERS: "true"
      OIDC_ISSUER: https://auth.codestra.co/realms/codestra
      OIDC_AUDIENCE: freight-platform-api
      OIDC_JWKS_URL: https://auth.codestra.co/realms/codestra/protocol/openid-connect/certs
      INTEGRATION_ALLOWED_HOSTS: n8n.internal.example,odoo.internal.example
      COMPLIANCE_IDENTIFIER_PEPPER: ci-only-pepper
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4
        with:
          ref: be/release-readiness-v6
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and migrate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyyaml
          alembic upgrade head
          alembic -c alembic-compliance.ini upgrade head

      - name: Capture bounded contract output
        shell: bash
        run: |
          set +e
          pytest -q --tb=short --maxfail=20 \
            tests/test_integrations_contract.py \
            tests/test_compliance_gateway_contract.py \
            > /tmp/contracts.stdout 2> /tmp/contracts.stderr
          status=$?
          set -e

          mkdir -p docs/ci
          python - "$status" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          combined = (
              Path('/tmp/contracts.stdout').read_text(encoding='utf-8', errors='replace')
              + '\n'
              + Path('/tmp/contracts.stderr').read_text(encoding='utf-8', errors='replace')
          )
          combined = re.sub(
              r'postgresql\+asyncpg://[^@\s]+@',
              'postgresql+asyncpg://***@',
              combined,
          )
          Path('docs/ci/compliance-contract-failure.json').write_text(
              json.dumps(
                  {
                      'exit_code': status,
                      'output': '\n'.join(combined.splitlines()[-600:]),
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          rm .github/workflows/capture-contract-failure.yml

      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ci): record compliance contract failure evidence"
          git push origin HEAD:be/release-readiness-v6
