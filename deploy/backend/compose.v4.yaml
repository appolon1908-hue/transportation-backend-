name: freight-platform-backend

x-backend-image: &backend-image ${FREIGHT_BACKEND_IMAGE:?set immutable image tag or digest}
x-common-env: &common-env
  ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?required}
  OIDC_ISSUER: ${OIDC_ISSUER:?required}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:?required}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:?required}
  INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:?required}

services:
  migrate:
    image: *backend-image
    command: ["migrate"]
    environment:
      <<: *common-env
    networks:
      - freight_private
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  freight-api:
    image: *backend-image
    command: ["api"]
    env_file:
      - ${INTEGRATION_SECRETS_ENV_FILE:?required}
    environment:
      <<: *common-env
      PORT: "8000"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?required}
      TRUSTED_GATEWAY_CIDRS: ${TRUSTED_GATEWAY_CIDRS:?required}
      GATEWAY_SHARED_SECRET_FILE: /run/secrets/gateway_shared_secret
      COMPLIANCE_IDENTIFIER_PEPPER_FILE: /run/secrets/compliance_identifier_pepper
    secrets:
      - gateway_shared_secret
      - compliance_identifier_pepper
    expose: ["8000"]
    networks:
      freight_private:
        aliases:
          - freight-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  integration-worker:
    image: *backend-image
    command: ["worker"]
    env_file:
      - ${INTEGRATION_SECRETS_ENV_FILE:?required}
    environment:
      <<: *common-env
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?dedicated BYPASSRLS worker role required}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      DELIVERY_CONCURRENCY: ${DELIVERY_CONCURRENCY:-8}
      OUTBOX_FANOUT_BATCH: ${OUTBOX_FANOUT_BATCH:-50}
      DELIVERY_CLAIM_BATCH: ${DELIVERY_CLAIM_BATCH:-25}
      INBOUND_CLAIM_BATCH: ${INBOUND_CLAIM_BATCH:-25}
    networks:
      - freight_private
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256

secrets:
  gateway_shared_secret:
    file: ${GATEWAY_SHARED_SECRET_FILE:?required}
  compliance_identifier_pepper:
    file: ${COMPLIANCE_IDENTIFIER_PEPPER_FILE:?required}

networks:
  freight_private:
    external: true
    name: ${FREIGHT_BACKEND_NETWORK:-freight_private}
