[project]
name = "freight-platform-backend"
version = "0.1.0"
description = "Multi-tenant freight brokerage / 3PL platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<0.117",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy[asyncio]>=2.0.43,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.16,<1.17",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<0.29",
  "structlog>=25.4,<26"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
